services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    environment:
      # Database connection
      DATABASE_URL: postgresql+psycopg2://rag_user:rag_pass@postgres:5432/ragdb
      # Qdrant vector DB
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: research_papers
      # Ollama LLM - point to host machine if Ollama is running locally
      # Change to your host IP or keep as localhost if using host network
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Re-ranking settings
      RERANK_RETRIEVAL_MULTIPLIER: 2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./temp:/app/temp
      - hf_cache:/cache
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
    ports:
      - "5433:5432"  # host:container (use 5433 on host to avoid conflicts)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
  hf_cache:

